name: Build unsigned IPA

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "dist/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (unsigned, Release, iphoneos)
        run: |
          set -o pipefail
          xcodebuild \
            -project Slate.xcodeproj \
            -scheme Slate \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee build.log

      - name: Show compiler errors
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -150 || true

      - name: Package Payload into .ipa
        run: |
          rm -rf Payload dist
          mkdir -p Payload dist
          cp -R build/Build/Products/Release-iphoneos/Slate.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload dist/Slate-unsigned.ipa
          ls -la dist
          unzip -l dist/Slate-unsigned.ipa | tail -5

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Slate-unsigned-ipa
          path: dist/Slate-unsigned.ipa

      - name: Commit IPA back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/Slate-unsigned.ipa
          git commit -m "Add unsigned Slate.ipa built from ${GITHUB_SHA::7}" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
